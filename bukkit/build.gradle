repositories {
    flatDir {dirs 'lib'}
}
dependencies {
    api project(':core')
    api 'com.sk89q:worldguard:6.0.0-SNAPSHOT'
    api('com.destroystokyo.paper:paper-api:1.12-R0.1-SNAPSHOT') {
        exclude group: 'net.md-5'
    }
    compileOnly files('../libs/Craftbukkit_1_12.jar')
    compileOnly files('../libs/Craftbukkit_1_11.jar')
    compileOnly files('../libs/Craftbukkit_1_10.jar')
    compileOnly files('../libs/Craftbukkit_1_9.jar')
    compileOnly files('../libs/Craftbukkit_1_8.jar')
    compileOnly files('../libs/Craftbukkit_1_7.jar')
    api 'com.github.MilkBowl:VaultAPI:1.7'
    compileOnly files('../libs/GriefPrevention.jar')
    compileOnly files('../libs/regios.jar')
    compileOnly files('../libs/Residence.jar')
    compileOnly files('../libs/plotme_core.jar')
    compileOnly files('../libs/BlocksHub.jar')
    api 'junit:junit:4.13.1'
    api('com.sk89q.worldedit:worldedit-bukkit:6.1.5') {
        transitive = false
    }
    compileOnly files('../libs/voxelsniper-5.171.0.jar')
    api 'net.dmulloy2:ProtocolLib:5.1.0'
    api 'com.wasteofplastic:askyblock:3.0.9.4'
    api('org.inventivetalent:mapmanager:1.7.2-SNAPSHOT') {
        transitive = false
    }
}

processResources {
    from('src/main/resources') {
        include 'plugin.yml'
        expand(
                name: project.parent.name,
                version: project.parent.version
        )
    }
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

apply plugin: 'com.gradleup.shadow'
// We only want the shadow jar produced
shadowJar {
    dependencies {
        include(dependency('com.github.luben:zstd-jni:1.5.7-4'))
        include(dependency('co.aikar:fastutil-lite:1.0'))
        include(project(':core'))
    }
    archiveFileName = "${parent.name}-${project.name}-${parent.version}.jar"
    destinationDirectory = file '../target'
    relocate('com.google.gson', 'com.sk89q.worldedit.internal.gson')
}
shadowJar.doLast {
    task ->
        ant.checksum file: task.archiveFile.get().asFile
}

build.dependsOn(shadowJar);
