buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.gradleup.shadow:shadow-gradle-plugin:9.6.1'
    }
}

task setupCIWorkspace {
    // do nothing, stub method
}

apply plugin: 'java'
clean { delete "target" }

group = 'com.boydti.fawe'

def git(String... args) {
    def proc = (["git"] + args.toList()).execute(null, rootDir)
    def out = proc.text
    if (proc.waitFor() != 0) throw new GradleException("git ${args.join(' ')} failed")
    return out
}

def revision = ""
def buildNumber = ""
def semver = ""
def date = ""
ext {
    try {
        date = git("show", "-s", "--format=%cd", "--date=format:%y.%m.%d", "HEAD").trim()
        revision = "-" + git("rev-parse", "--short=7", "HEAD").trim()
        // Full messages of every first-parent ancestor of HEAD, newest first
        def messages = []
        if (git("rev-list", "--parents", "-n", "1", "HEAD").trim().split(" ").length > 1) {
            messages = git("log", "--first-parent", "--format=%x1e%B", "HEAD~1").split("\u001e").drop(1)
        }
        int index = -67;  // Offset to match CI
        int major = 0, minor = 0, patch = 0;
        for (String message : messages) {
            int majorCount = 0, minorCount = 0, patchCount = 0;
            patchCount = minor == 0 && major == 0 ? 1 : 0;
            for (String line : message.tokenize("\n")) {
                switch (line.replaceAll("- ", "").split(" ")[0].toLowerCase()) {
                    case "minor":
                    case "added":
                    case "add":
                    case "change":
                    case "changed":
                    case "changes":
                        if (major == 0) {
                            minorCount = 1; patchCount = 0;
                        }
                        break;
                    case "refactor":
                    case "remove":
                    case "major":
                        patchCount = minorCount = 0;
                        majorCount = 1;
                        break;
                }
            }
            major += majorCount;
            minor += minorCount;
            patch += patchCount;
            index++
        }
        buildNumber = "-${index}"
        semver = "-${major}.${minor}.${patch}"
    } catch (Throwable ignore) {
        revision = "unknown";
    }
}

version = date + revision + buildNumber + semver
if ( project.hasProperty("lzNoVersion") ) { // gradle build -PlzNoVersion
    version = "unknown"
}
description = """FastAsyncWorldEdit"""

subprojects {

    apply plugin: 'java-library'
    apply plugin: 'eclipse'
    apply plugin: 'idea'

    compileJava {
        options.release = 25
        options.compilerArgs += ["-parameters", "-Xprefer:source"]
    }

    repositories {
        mavenCentral()
        maven {url "https://repo.destroystokyo.com/repository/maven-public//"}
        maven {url "https://ci.athion.net/plugin/repository/tools/"}
        maven {url "https://hub.spigotmc.org/nexus/content/groups/public/"}
        maven {url "https://maven.enginehub.org/repo/"}
        maven {url "https://repo.maven.apache.org/maven2"}
        maven {url "https://ci.frostcast.net/plugin/repository/everything"}
        maven {url "https://repo.spongepowered.org/maven"}
        maven {url "https://repo.inventivetalent.org/content/groups/public/"}
        maven {url "https://store.ttyh.ru/libraries/"}
        maven {url "https://repo.dmulloy2.net/nexus/repository/public/"}
        maven {url "https://maven.elmakers.com/repository/"}
        maven {url "https://ci.ender.zone/plugin/repository/everything/"}
        maven {url "https://repo.papermc.io/repository/maven-public/"}
        maven {url "https://jitpack.io"}
        maven {url "https://repo.codemc.org/repository/maven-public"}
    }
}
task aggregatedJavadocs(type: Javadoc, description: 'Generate javadocs from all child projects as if it was a single project', group: 'Documentation') {
    destinationDirectory = file("./docs/javadoc")
    title = "$project.name $version API"
    options.author true
    options.links 'https://docs.spring.io/spring/docs/4.3.x/javadoc-api/', 'https://docs.oracle.com/javase/8/docs/api/', 'https://docs.spring.io/spring-ws/docs/2.3.0.RELEASE/api/', 'https://docs.spring.io/spring-security/site/docs/4.0.4.RELEASE/apidocs/'
    options.addStringOption('Xdoclint:none', '-quiet')

    delete "./docs"

    subprojects.each { proj ->
        proj.tasks.withType(Javadoc).each { javadocTask ->
            source += javadocTask.source
            classpath += javadocTask.classpath
            excludes += javadocTask.excludes
            includes += javadocTask.includes
        }
    }
}
